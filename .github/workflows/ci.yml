name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - run: composer install --no-progress --prefer-dist

      - name: PHPCS (WordPress Coding Standards)
        run: composer lint

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint:js

      - name: Build admin app
        run: npm run build

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring
          tools: composer
          coverage: none

      # Same production build deploy.yml runs before pushing to SVN (Strauss prefixes mPDF in post-install).
      - run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Smoke-test autoloader
        run: php -r 'require "vendor/autoload.php"; require "vendor-prefixed/autoload.php"; foreach (["WPBook\\Vendor\\Mpdf\\Mpdf", "WPBook\\Vendor\\Mpdf\\QrCode\\QrCode", "WPBook\\Plugin", "WPBook\\Render\\Mpdf_Engine"] as $c) { if (!class_exists($c)) { fwrite(STDERR, "missing $c\n"); exit(1); } } if (class_exists("Mpdf\\Mpdf")) { fwrite(STDERR, "unprefixed mPDF is loadable\n"); exit(1); }'

      - name: Generate a PDF
        run: php tests/smoke-pdf.php

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported pair and newest pair.
          - php: '7.4'
            wp: '6.4'
          - php: '8.3'
            wp: 'latest'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, mysqli
          tools: composer
          coverage: none

      - run: composer install --no-progress --prefer-dist --no-interaction

      - name: Install WordPress test library
        run: bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}

      - name: PHPUnit
        run: vendor/bin/phpunit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer
          coverage: none

      # wp-book.php requires vendor/ and vendor-prefixed/; without them activation fails.
      - run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci && npm run build

      # Check exactly what deploy.yml ships to SVN: the checkout minus .distignore.
      - name: Build release copy
        run: rsync -a --exclude-from=.distignore ./ "$RUNNER_TEMP/wp-book/"

      - name: WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ${{ runner.temp }}/wp-book
          slug: wp-book
          exclude-directories: 'vendor,vendor-prefixed,build'
          # The wp-book slug predates the "wp" naming rule and cannot be changed on WordPress.org.
          ignore-codes: 'trademarked_term'
