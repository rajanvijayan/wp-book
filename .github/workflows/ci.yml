name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - run: composer install --no-progress --prefer-dist

      # Non-blocking until the imported code has a clean baseline; then remove continue-on-error.
      - name: PHPCS (WordPress Coding Standards)
        continue-on-error: true
        run: composer lint

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer
          coverage: none

      # wp-book.php requires vendor/autoload.php; without it activation fatals.
      - run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: WordPress Plugin Check
        if: hashFiles('readme.txt') != ''
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './'
          exclude-directories: '.github,.wordpress-org,vendor,node_modules'

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring
          tools: composer
          coverage: none

      # Same production build deploy.yml runs before pushing to SVN.
      - run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Smoke-test autoloader
        run: php -r 'require "vendor/autoload.php"; foreach (["Mpdf\\Mpdf", "WPBook\\Main"] as $c) { if (!class_exists($c)) { fwrite(STDERR, "missing $c\n"); exit(1); } }'

      - name: Generate a PDF
        run: php tests/smoke-pdf.php
