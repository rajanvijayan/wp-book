name: Deploy to WordPress.org

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches plugin version and Stable tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAIN=$(grep -l "Plugin Name:" ./*.php | head -n1)
          HEADER=$(grep -m1 -E "^\s*\*?\s*Version:" "$MAIN" | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          STABLE=$(grep -m1 -i "^Stable tag:" readme.txt | sed -E 's/^Stable tag:\s*//I' | tr -d '[:space:]')
          echo "tag=$TAG header=$HEADER stable=$STABLE ($MAIN)"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Tag, plugin header Version and readme.txt Stable tag must all match."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: gd, mbstring
          tools: composer
          coverage: none

      # vendor/ is not in Git; wp-book.php requires vendor/autoload.php, so build it here.
      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Smoke-test autoloader
        run: php -r 'require "vendor/autoload.php"; foreach (["Mpdf\\Mpdf", "WPBook\\Main"] as $c) { if (!class_exists($c)) { fwrite(STDERR, "missing $c\n"); exit(1); } }'

      - name: Deploy to WordPress.org SVN
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: wp-book

      - name: Attach ZIP to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
